# ~/.config/hypr/hypridle.conf
general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh      # loginctl lock-session / Super+L
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screens off (wake with any key / mouse)
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend is intentionally NOT enabled (desktop running long jobs/downloads).
# Uncomment to suspend after 60 min idle:
# listener {
#     timeout = 3600
#     on-timeout = systemctl suspend
# }
