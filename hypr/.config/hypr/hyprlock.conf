# ~/.config/hypr/hyprlock.conf
# Colors ($base, $text, $accent, ...) come from the theme switcher.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred screenshot of the current desktop
background {
    monitor =
    path = screenshot
    color = $base                 # fallback if the screenshot is unavailable
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 90
    font_family = JetBrainsMono Nerd Font ExtraBold
    halign = center
    valign = center
    position = 0, 160
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %d %B %Y')"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    halign = center
    valign = center
    position = 0, 80
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $base
    font_color = $text
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 14
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $peach
    halign = center
    valign = center
    position = 0, -20
}

label {
    monitor =
    text = $USER
    color = $subtext
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    halign = center
    valign = center
    position = 0, -90
}
