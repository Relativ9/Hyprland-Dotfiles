# GENERATED by theme-switch.sh (template: themes/.config/themes/templates/satty.toml)
[general]
fullscreen = false
floating-hack = true
early-exit = ["copy", "save"]
copy-command = "wl-copy"
save-after-copy = true
output-filename = "~/Pictures/Screenshots/screenshot-%Y-%m-%d_%H-%M-%S.png"
initial-tool = "arrow"
corner-roundness = 12
default-round-caps = true
brush-smooth-history-size = 8
annotation-size-factor = 2
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]
actions-on-right-click = []
notification-thumbnail = "screenshot"

[color-palette]
palette = [
    "#ff757fff",
    "#ff966cff",
    "#ffc777ff",
    "#c3e88dff",
    "#0db9d7ff",
    "#c099ffff",
    "#c8d3f5ff",
    "#191b29ff",
]
